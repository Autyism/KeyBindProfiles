plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/keybindprofilesplus.accesswidener")

	runs {
		// Dev client that runs the automated self-test and quits (see tools/selftest.ps1).
		selfTest {
			client()
			configName = "Self Test"
			vmArg "-Dkbp.selftest=true"
			runDir "run"
			ideConfigGenerated false
		}
	}
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu: only its API is compiled against (the configure button in the mod list). It is also
	// put into the dev client so the self-test can check that button; the released jar does not need it.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Other mods whose own hotkeys are listed and edited (external/): Meteor Client, the malilib family and
	// Inventory Profiles Next.
	// They are reached by reflection on their own class and method names (which are the same in every
	// environment), so the mod needs none of them to build or to run. Their current jars are built with a
	// newer Loom than this project uses, which Loom refuses to put on the class path.
	//
	// For the dev client (and with it the self-test) tools/prepare-dev-mods.ps1 puts copies of malilib,
	// Litematica, Meteor and IPN (with the Loom version in their manifests lowered, plus the libraries Meteor
	// carries inside its jar) into libs/, which is not committed. Without libs/ the dev client simply runs
	// without them.
	for (String dir : ["libs/malilib", "libs/meteor", "libs/ipn"]) {
		if (file(dir).isDirectory()) {
			modLocalRuntime fileTree(dir) { include "*.jar" }
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// GPLv3 for this mod, plus the MIT notice of the upstream code it is based on.
	from(["LICENSE", "LICENSE-upstream-MIT"]) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}